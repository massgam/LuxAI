<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>LuxAI Mini App</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">L</div>
        <div>
          <h1>LuxAI</h1>
          <p>AI Assistant Pro</p>
        </div>
      </div>

      <button class="new-chat" id="newChat">＋ New Chat</button>

      <nav>
        <button class="nav active" data-mode="chat">💬 AI Chat</button>
        <button class="nav" data-mode="image">🎨 Image Studio</button>
        <button class="nav" data-mode="edit">🖼️ Photo Edit</button>
        <button class="nav" data-mode="files">📄 File Analysis</button>
        <button class="nav" data-mode="voice">🎤 Voice</button>
      </nav>

      <div class="user-card">
        <div class="avatar" id="avatar">A</div>
        <div>
          <strong id="userName">User</strong>
          <span id="userLang">Auto language</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div>
          <h2 id="screenTitle">AI Chat</h2>
          <p id="screenSub">Chat, voice, image, file analysis</p>
        </div>
        <div class="status">● Online</div>
      </header>

      <section class="hero">
        <div class="hero-glow"></div>
        <h3>LuxAI Pro</h3>
        <p>ChatGPT-style AI experience inside Telegram.</p>
        <div class="chips">
          <span>Русский</span>
          <span>Українська</span>
          <span>Türkçe</span>
          <span>English</span>
        </div>
      </section>

      <section class="chat" id="chat">
        <div class="message ai">
          <div class="bubble">
            Welcome to LuxAI. Send text, image, voice or files from Telegram bot. Mini App interface is ready.
          </div>
        </div>
      </section>

      <section class="composer">
        <div class="tools">
          <label class="tool">
            📎
            <input type="file" id="fileInput" hidden />
          </label>
          <label class="tool">
            🖼️
            <input type="file" id="imageInput" accept="image/*" hidden />
          </label>
          <button class="tool" id="voiceBtn">🎤</button>
        </div>

        <textarea id="prompt" rows="1" placeholder="Ask LuxAI anything..."></textarea>
        <button class="send" id="sendBtn">➤</button>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
