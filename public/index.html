<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LuxAI Pro</title>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial;background:#090912;color:#fff}
    .wrap{max-width:900px;margin:0 auto;padding:24px}
    .card{background:linear-gradient(135deg,#151529,#22123a);border:1px solid #35275a;border-radius:24px;padding:24px;box-shadow:0 16px 60px #0008}
    h1{font-size:36px;margin:0 0 8px}.gold{color:#ffd56a}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:18px}
    .box{background:#111120;border:1px solid #292947;border-radius:18px;padding:16px}
    .btn{display:inline-block;margin-top:18px;background:#7c3aed;color:white;text-decoration:none;padding:12px 18px;border-radius:14px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1><span class="gold">LuxAI</span> Pro</h1>
      <p>Telegram içinde çalışan güçlü AI asistan.</p>
      <div class="grid">
        <div class="box">🤖 Yazılı sohbet</div>
        <div class="box">🎤 Sesli mesaj okuma</div>
        <div class="box">🎥 Video note okuma</div>
        <div class="box">🖼️ Fotoğraf analizi</div>
        <div class="box">🎨 Görsel oluşturma</div>
        <div class="box">✏️ Fotoğraf düzenleme</div>
        <div class="box">📄 PDF/TXT okuma</div>
        <div class="box">📊 Admin takip</div>
      </div>
      <a class="btn" href="https://t.me/">Telegram’da Aç</a>
    </div>
  </div>
</body>
</html>
