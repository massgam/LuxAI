<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LuxAI Pro</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="bg">
    <span></span><span></span><span></span>
  </div>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">L</div>
        <div>
          <h1>LuxAI</h1>
          <p>Premium AI Studio</p>
        </div>
      </div>

      <button class="primary" id="newChat">＋ New Chat</button>

      <div class="nav-title" data-i18n="workspace">Workspace</div>
      <button class="nav active" data-mode="chat">💬 <span data-i18n="ai_chat">AI Chat</span></button>
      <button class="nav" data-mode="image">✨ <span data-i18n="image_studio">Image Studio</span></button>
      <button class="nav" data-mode="edit">🎨 <span data-i18n="photo_edit">Photo Edit</span></button>
      <button class="nav" data-mode="files">📄 <span data-i18n="file_analysis">File Analysis</span></button>
      <button class="nav" data-mode="voice">🎙️ <span data-i18n="voice_chat">Voice Chat</span></button>

      <div class="mini-stats">
        <div><strong>Pro</strong><span data-i18n="plan">Plan</span></div>
        <div><strong>24/7</strong><span>Online</span></div>
      </div>

      <div class="profile">
        <div class="avatar" id="avatar">L</div>
        <div>
          <strong id="userName">LuxAI User</strong>
          <span id="userLang">Auto</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <button class="icon" id="menuBtn">☰</button>
        <div>
          <h2 id="title">LuxAI Pro</h2>
          <p id="subtitle" data-i18n="subtitle">Your professional AI assistant inside Telegram</p>
        </div>
        <button class="pill" id="langBtn">🌐 Auto</button>
      </header>

      <section class="hero">
        <div class="hero-text">
          <span class="badge">LuxAI Pro</span>
          <h3 id="welcome">Welcome</h3>
          <p id="welcomeSub">Create, edit, analyze and chat with premium AI.</p>
          <div class="quick">
            <button data-prompt="Create a luxury gold LuxAI logo">Luxury logo</button>
            <button data-prompt="Analyze my uploaded photo">Analyze photo</button>
            <button data-prompt="Help me write a professional message">Write text</button>
          </div>
        </div>
        <div class="orb-card">
          <div class="orb">AI</div>
        </div>
      </section>

      <section class="messages" id="messages"></section>

      <section class="composer">
        <button class="tool" id="attachBtn">📎</button>
        <button class="tool" id="imageBtn">🖼️</button>
        <button class="tool" id="micBtn">🎙️</button>
        <textarea id="input" rows="1" placeholder="Ask LuxAI anything..."></textarea>
        <button class="send" id="sendBtn">➤</button>
        <input id="fileInput" type="file" hidden />
        <input id="photoInput" type="file" accept="image/*" hidden />
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
