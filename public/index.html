<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LuxAI Mini App</title>
  <style>
    body{margin:0;background:#07070b;color:white;font-family:Inter,Arial,sans-serif}
    .wrap{max-width:860px;margin:0 auto;padding:24px}
    .hero{background:linear-gradient(135deg,#15151f,#241238);border:1px solid #3b2a55;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0008}
    h1{font-size:34px;margin:0 0 8px}
    p{color:#cfc7df;line-height:1.5}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:20px}
    .card{background:#11111a;border:1px solid #242436;border-radius:18px;padding:18px}
    .btn{display:inline-block;margin-top:18px;background:#8b5cf6;color:white;padding:13px 18px;border-radius:14px;text-decoration:none;font-weight:700}
    .gold{color:#f5c15b}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>LuxAI <span class="gold">Pro</span></h1>
      <p>Telegram içinde çalışan güçlü AI asistan. Yazı, ses, fotoğraf analizi, dosya okuma ve görsel oluşturma özellikleri.</p>
      <a class="btn" href="https://t.me/">Telegram Botu Aç</a>
    </div>
    <div class="grid">
      <div class="card">💬 AI Sohbet</div>
      <div class="card">🎤 Sesli mesaj anlama</div>
      <div class="card">🖼️ Fotoğraf analizi</div>
      <div class="card">🎨 Görsel oluşturma</div>
      <div class="card">📄 PDF/TXT okuma</div>
      <div class="card">📊 Admin takip paneli</div>
    </div>
  </div>
</body>
</html>
